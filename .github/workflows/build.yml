name: Build

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '.gitignore'
      - 'README.md'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'README.md'

concurrency:
  group: ci-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Gradle
        uses: GeyserMC/actions/setup-gradle-composite@master
        with:
          setup-java_java-version: 25

      - name: Build Conduit
        run: ./gradlew build

      - name: Publish to Maven Repository
        if: ${{ success() && github.event_name != 'pull_request' && github.repository == 'opencollab-incubator/Conduit' && github.ref_name == 'master' }}
        run: ./gradlew publish
        env:
          ORG_GRADLE_PROJECT_openCollabSnapshotsUsername: ${{ secrets.OPENCOLLAB_USERNAME }}
          ORG_GRADLE_PROJECT_openCollabSnapshotsPassword: ${{ secrets.OPENCOLLAB_PASSWORD }}
